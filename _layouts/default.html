<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
  document.querySelectorAll('a[data-user][data-domain]').forEach(function(el){
    var e=el.dataset.user+'@'+el.dataset.domain;
    el.href='mailto:'+e;
    if(!el.textContent.trim()||el.textContent.trim()==='Email')el.textContent=e;
  });
  (function(){
    var lb=document.getElementById('lightbox'),img=document.getElementById('lightbox-img');
    if(!lb)return;
    document.querySelectorAll('.lightbox-trigger').forEach(function(a){
      a.addEventListener('click',function(e){
        e.preventDefault();
        img.src=this.href;
        img.alt=this.querySelector('img').alt;
        lb.classList.add('active');
      });
    });
    lb.addEventListener('click',function(){lb.classList.remove('active');});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')lb.classList.remove('active');});
  })();
  </script>
</body>
</html>
