<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
  document.querySelectorAll('a[data-user][data-domain]').forEach(function(el){
    var e=el.dataset.user+'@'+el.dataset.domain;
    el.href='mailto:'+e;
    if(!el.textContent.trim()||el.textContent.trim()==='Email')el.textContent=e;
  });
  </script>
</body>
</html>
